name: GitHub Cache Workflow

on:
  push:
    branches:
      - github-cache
  workflow_dispatch:

jobs:
  no-cache:
    name: Without Cache
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Remove Maven repository
        run: |
          rm -rf ~/.m2/repository
          echo "Maven local repository cleared"
          du -sh ~/.m2/repository || true

      - name: Download dependencies without cache
        run: |
          echo "Starting dependency download without cache"
          mvn -B dependency:go-offline

      - name: Build
        run: |
          echo "Building project without cache"
          mvn -B clean package -DskipTests

  with-cache:
    name: With GitHub Cache
    runs-on: ubuntu-latest
    needs: no-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Maven cache
        id: maven-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Show cache status
        run: |
          echo "Cache hit: ${{ steps.maven-cache.outputs.cache-hit }}"
          echo "Cache key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}"
          du -sh ~/.m2/repository || true

      - name: Download dependencies with cache
        run: |
          echo "Restoring dependencies from cache when available"
          mvn -B dependency:go-offline

      - name: Build
        run: |
          echo "Building project with cache"
          mvn -B clean package -DskipTests