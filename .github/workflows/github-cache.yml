name: GitHub Cache Workflow

on:
    push:
        branches:
            - github-cache
    workflow_dispatch:

jobs:
    cache_creation:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Cache Maven dependencies
              uses: actions/cache@v3
              with:
                path: |
                    ~/.m2/repository
                key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            
            - name: Print cache directory (before cache creation)
              continue-on-error: true
              run: |
                ls -ltr ~/.m2/repository
            
            - name: Build the project
              run: mvn clean package -Dmaven.test.skip=true

            - name: Print cache directory (after cache creation)
              run: |
                ls -ltr ~/.m2/repository

    cache-usage:
        runs-on: ubuntu-latest
        needs: cache_creation
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  distribution: "temurin"
                  java-version: "17"
            
            - name: check cache directory (before cache restore)
              continue-on-error: true
              run: |
                ls -ltr ~/.m2/repository

            - name: Cache Maven dependencies
              uses: actions/cache@v3
              with:
                path: |
                    ~/.m2/repository
                key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

            - name: check cache directory (after cache restore)
              run: |
                ls -ltr ~/.m2/repository

            - name: Build the project
              run: mvn clean package -Dmaven.test.skip=true

            - name: Print cache directory (after build)
              run: |
                ls -ltr ~/.m2/repository