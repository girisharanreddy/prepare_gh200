name: Self Hosted Runner Workflow

on:
    push:
        branches:
            - github-hosted-runner
    
    workflow_dispatch:

jobs:
    Runner_Information:
        name: Runner Information
        runs-on: ubuntu-latest
        steps:
            - name: print runner machine info
              run: echo "${{ toJson(runner) }}"
            - name: Download Sample File
              run: |
                curl -l https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf --output dummy.pdf
            - name: Check if the file exists
              run: |
                if [ -f "dummy.pdf" ]; then
                  echo "File exists."
                else
                  echo "File does not exist."
                fi
            - name: Print file in runner workspace
              run: |
                ls -l ${{ runner.workspace }}
            - name: Print files in runner temp directory
              run: |
                ls -l ${{ runner.temp }}
            - name: Print files in prepare_gh200 repository
              run: |
                cd prepare_gh200
                ls -lrt